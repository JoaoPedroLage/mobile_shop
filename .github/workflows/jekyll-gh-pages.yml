name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm install -g eas-cli
          npm install
          npm install crypto-browserify stream-browserify buffer
          
      - name: Build Expo Web
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npx expo export:web
          
      - name: Configure Jekyll
        run: |
          echo 'theme: jekyll-theme-minimal' > _config.yml
          echo 'exclude: [node_modules]' >> _config.yml
          echo 'include: [404.html]' >> _config.yml
          mv dist/ _site/
          
      - name: Create 404.html for SPA
        run: |
          echo '<!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                sessionStorage.redirect = location.pathname;
                window.location.href = "/";
              </script>
            </head>
            <body>
              <p>If not redirected, <a href="/">click here</a>.</p>
            </body>
          </html>' > _site/404.html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
