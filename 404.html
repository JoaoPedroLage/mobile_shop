<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script>
      // Redireciona todas as rotas para index.html (necessário para SPAs)
      sessionStorage.redirect = location.pathname;
      window.location.href = '/';
    </script>
  </head>
  <body>
    <p>Se não for redirecionado, <a href="/">clique aqui</a>.</p>
  </body>
</html>
